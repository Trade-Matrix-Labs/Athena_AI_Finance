/* shared editions */
.edrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 6px; grid-column: 1 / -1; }
.edrow .btn.text { min-height: 28px; padding: 0 4px; }
.tag.ed { color: var(--ink-2); }
/* app mode: the edition's status details, a disclosure beside the edition tag. It floats over the page from the sticky
   header (its own scroll for a long findings list); the phone keeps it in the flow */
.edd { position: relative; }
.edd > summary { list-style: none; cursor: pointer; }
.edd > summary::-webkit-details-marker { display: none; }
.edd > summary::after { content: "▾"; margin-left: 4px; font-size: 11px; }
.edd[open] > summary::after { content: "▴"; }
.edbox { position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: min(560px, calc(100vw - 32px)); max-height: min(60vh, 520px); overflow: auto; overscroll-behavior: contain; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: 0 16px 40px -24px var(--shadow); padding: 12px 16px 14px; font: 400 13px/20px var(--sans); color: var(--ink-1); }
.edbox p { margin: 0 0 8px; }
.edbox .edno { font-weight: 600; }
/* the server's status strip: every word stays readable and it covers nothing. From 900 px it rides at the top right, wrapping
   clear of the side rail, and the sheet header and the pages keep their tops below its measured foot (--stripB). On the phone
   it takes a place at the top of the page, above the sticky top bar, whose status words stay in sight once it scrolls away */
#edition-status { position: fixed; top: 4px; right: 8px; max-width: calc(100vw - var(--sideW) - 16px); z-index: 2147483647; pointer-events: none; }
@media (min-width: 900px) { .page-pad { padding-top: max(40px, calc(var(--stripB, 0px) + 8px)); } body:not(.indesk) #edition-status { position: absolute; } } /* a page has no sticky header to ride on: the strip scrolls with it, never over its text */
@media (max-width: 899px) { #edition-status { position: static; max-width: none; margin: 4px 8px; } .wp-h #trayMin { width: 44px; height: 44px; } .traybox.min .chiprow { display: none; } } /* the minimised tray: its line and the composer, so the reading stays in view */
/* the per-edition label in the server's status strip, at 12 px: on the strip's line from 1280 px (the strip stays
   one line, clear of the Report/Conversation tabs), its own wrapping line below that */
#edition-status .edlab { font-size: 12px; }
#edition-status .edlab::before { content: " · " / ""; }
@media (max-width: 1279px) { #edition-status .edlab { display: block; line-height: 16px; white-space: normal; } #edition-status .edlab::before { content: none; } }
/* the sticky sheet header starts below the strip's measured foot (--stripB, set by padTop), so the strip never covers the
   Report/Conversation tabs, one line or two, scrolled or not; without the strip (static page) the header keeps its 10 px */
.shead { padding-top: max(10px, calc(var(--stripB, 0px) + 6px)); }
.edst { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 16px; margin: 8px 0 12px; }
.edst dt { color: var(--ink-3); }
.edst dd { margin: 0; }
.edbox h3 { margin: 0 0 4px; }
.edf { margin: 0; padding-left: 22px; }
.edf li { margin: 2px 0; overflow-wrap: anywhere; }
.edf b { font-weight: 600; }
.edrow .apierr { font-size: 12.5px; line-height: 18px; color: var(--caution); }
@media (max-width: 899px) { .edbox { position: static; width: auto; max-height: none; margin-top: 8px; box-shadow: none; } }
/* app mode: a table quoted from the filing (block.filing_table), in the report's table style: its column heads, rows,
   lead-in and notes as the filing prints them */
.ftable .blk-s { margin-top: 4px; }
.ftable thead tr:not(:last-child) th { text-align: center; border-bottom-color: var(--line); }
.ftable thead tr:not(:last-child) th:first-child { border-bottom: 0; }
.ftable .cap p { margin: 0 0 6px; }
/* a filing table wider than its column shows a soft shadow on each side that has more to scroll (the paper covers
   ride with the table, the shadows stay with the box, so a side with nothing left to scroll shows none) */
.ftable .tbx { background: linear-gradient(90deg, var(--paper) 40%, transparent) 0 0 / 28px 100% no-repeat local, linear-gradient(270deg, var(--paper) 40%, transparent) 100% 0 / 28px 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%, var(--shadow), transparent) 0 0 / 12px 100% no-repeat scroll, radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0 / 12px 100% no-repeat scroll; }
/* the Summary's own prose (cover.blocks) and the appendix on References keep the chapter's reading measure */
.sumprose { max-width: var(--textW); }
.soon { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); padding: 0 8px; }
.nfl { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.nfl li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.nfl li > a, .nfl li > span:first-child { flex: 1 1 220px; color: inherit; }
.nfl .st { font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.demoband { display: flex; gap: 10px; align-items: baseline; margin: 0 0 18px; font-size: 13.5px; line-height: 20px; color: var(--ink-2); max-width: 900px; }
.qs { margin-top: 20px; }
.qs-h { font: 400 24px/31px var(--serif); margin: 6px 0 14px; }
.qs .gauges { margin-bottom: 8px; }
.chlist.sofar li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.chlist.sofar .k { grid-column: 2; color: var(--ink-2); font-size: 13.5px; line-height: 20px; }
.qs .gauges { grid-template-columns: repeat(3, minmax(0, 1fr)); }

@media (max-width: 899px) {
  .writing > div:nth-child(2) { order: -1; }
  .gauges .gauge-c:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .qs .gauges { grid-template-columns: 1fr 1fr; }
  .qs .gauge-c:nth-child(4) { border-left: 1px solid var(--line); }
}

/* the edition row, shown on the phone only */
.pedrow { display: none; }
@media (max-width: 899px) { .pedrow { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 6px 12px; font-size: 12.5px; background: var(--desk); border-bottom: 1px solid var(--line); }
  .pedrow .btn.text { min-height: 32px; padding: 0 4px; } }
.sfig { color: var(--ink-1); }
.unchk { color: var(--ink-3); margin-left: 6px; vertical-align: 1px; }
.sofar-note { font-size: 13px; line-height: 19px; margin: -4px 0 8px; }
a.bcard.sample:hover { border-color: var(--line-strong); }
.labmsg { margin: 8px 0; font-size: 14px; line-height: 20px; color: var(--caution); }
/* operand chips: label on its own line, then value and its precision; nothing is cut */
.opchip { flex-wrap: wrap; row-gap: 2px; padding: 5px 8px; }
.opchip .l { flex: 1 1 100%; white-space: normal; }
.opchip .k { white-space: normal; line-height: 16px; text-align: right; margin-left: auto; }
/* narrow balloons (the 280 px lane): the depth labels drop their key hints, which the margin hint lists */
.bal { container: bal / inline-size; }
@container bal (max-width: 300px) { .travel .labs kbd { display: none; } .bal .plabel { flex-wrap: wrap; } }
/* the 256 px lane of a desk under 900 px: the Probe's header and detent names keep one line each, with room between them */
@container bal (max-width: 250px) { .bal-h .ttl3 { letter-spacing: .02em; } .travel .labs button { letter-spacing: .02em; padding: 0 2px; } }
/* ---------------- open panels: the Probe, an open conversation balloon and the show-through panel float over the body at the
   lane's right edge, at least --panelW wide, over the body's right edge where the lane is narrower; the body never reflows or moves
   for them (follow-scroll aside, see renderST) ---------------- */
:root { --panelW: 440px; }
.lane > .bal.probe:not(.fold), .lane > .bal.conv.on { left: auto; right: 12px; width: max(calc(100% - 24px), var(--panelW)); z-index: 7; }
/* the Summary keeps its body width whether or not anything is open: its lane is a zero-width edge at the sheet's right, and what
   opens there floats over the body like the chapters' panels (folded labels and marker lists at the narrow lane's width) */
@media (min-width: 900px) {
  .binder.sum:not(.nolane) .sheet { grid-template-columns: var(--railW) minmax(0, 1fr) 0; }
  .binder.sum .lane { border-left: 0; }
  .binder.sum .lane > .bal:is(.fold, .mini), .binder.sum .lane > .lmlist { left: auto; right: 12px; width: 256px; }
}
.bal.ghost { pointer-events: none; z-index: 7; }
.under.mg { position: fixed; right: auto; z-index: 7; }
.under.mg .ulh.top { flex-wrap: wrap; }
.under .ulr { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 0 14px; padding-top: 4px; font: 500 12px/18px var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.under .ulr b { flex-basis: 100%; font: 600 13px/18px var(--sans); color: var(--ink-1); }
.under .ulr em { font-style: normal; }
.under .ulr strong { font: 500 13px/18px var(--mono); color: var(--ink-1); margin-left: 6px; }
#sheet.stx > .lane > *, #sheet.stx > .leaders { visibility: hidden; }
.stl { position: fixed; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 8; }
.stl path { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.stl path.c { stroke-dasharray: 2 3; } /* dotted from a calculated figure, solid from a quoted one */
.stl circle { fill: var(--paper); stroke: var(--accent); stroke-width: 1.25; }
.lane > .lmark { z-index: 8; }
/* the material: one frosted layer (Apple's regular variant): in light the Probe's ink-navy #111529 at 66% (over the page it renders
   a cool grey, about #595D65), in dark its own lighter navy #2C3354 at 80%; the body stays visible through it, blurred (12 px is the
   Gaussian sigma: at 16 or more the text behind turns to flat grey); text reads by bright ink and weight; a specular rim; layered
   shadow in light, a white ring in dark; one tinted primary action at most. Radius 20 px, midway between the glass step's 33 px and
   the 6 px (balloons) / 8 px (show-through) before it; inside it the app's own control radii (4 px; concentric 20 - 16 - 1 = 3 is
   below that) */
:root { --gTint: #111529; --matA: 66%; --gR: 20px; --gBand: color-mix(in srgb, var(--gTint) var(--matA), var(--sunk));
  --gI1: #FFFFFF; --gI2: #F6F7FB; --gI3: #E6E9F1; --gAcc: #E2E6FF;
  --gSh: 0 0 0 1px rgba(6, 8, 22, .08), 0 2px 4px -1px rgba(6, 8, 22, .16), 0 24px 48px -16px rgba(6, 8, 22, .36);
  --gShO: 0 0 0 1px rgba(6, 8, 22, .10), 0 3px 6px -1px rgba(6, 8, 22, .24), 0 28px 56px -16px rgba(6, 8, 22, .48);
  /* one hue per meaning, the same in the body's markers and the panels' highlights: reported in the filing (the app's teal, iris-b,
     hue 187) and calculated by code (a yellow, hue 95: at least 15 degrees clear of the caution amber, hue 72 light / 80 dark, which
     keeps its own meaning). Body: dark steps on the cream page; panels: light steps on the glass; the hue never moves */
  --mark-reported: #245D58; --mark-calculated: #756208; --hl-reported: #C5FFF9; --hl-calculated: #FFF4C6; }
:root[data-theme="dark"] { --gTint: #2C3354; --matA: 80%; --gAcc: #F1F4FF; --gSh: 0 0 0 1px rgba(255, 255, 255, .08); --gShO: var(--gSh);
  --mark-reported: #82C6BF; --mark-calculated: #DBC77A; --hl-reported: #BEF9F2; --hl-calculated: #F9EFC9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gTint: #2C3354; --matA: 80%; --gAcc: #F1F4FF; --gSh: 0 0 0 1px rgba(255, 255, 255, .08); --gShO: var(--gSh);
  --mark-reported: #82C6BF; --mark-calculated: #DBC77A; --hl-reported: #BEF9F2; --hl-calculated: #F9EFC9; } }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .bal.conv.on.ghost, .bal.probe.ghost, .under.mg) {
  --ink-1: var(--gI1); --ink-2: var(--gI2); --ink-3: var(--gI3); --accent: var(--gAcc); --accent-ink: #111529; --win-index: var(--gAcc);
  --win-ink: var(--gI1); --win-ink-2: var(--gI2); --win-ink-3: var(--gI3); --win-tick: rgba(255, 255, 255, .22); --win-in: transparent;
  --paper: transparent; --sunk: rgba(0, 0, 0, .14); --wash: rgba(255, 255, 255, .10); --wash-strong: rgba(255, 255, 255, .10);
  --line: rgba(255, 255, 255, .24); --line-strong: rgba(255, 255, 255, .28); --bal-line: rgba(255, 255, 255, .28); --tick: rgba(255, 255, 255, .32); --control: rgba(255, 255, 255, .55);
  --mark-reported: var(--hl-reported); --mark-calculated: var(--hl-calculated); --caution: #FDE4BB; --pencil: var(--gI2);
  background: color-mix(in srgb, var(--gTint) var(--matA), transparent); -webkit-backdrop-filter: blur(12px) saturate(180%); backdrop-filter: blur(12px) saturate(180%);
  border: 1px solid; border-color: rgba(255, 255, 255, .46) rgba(255, 255, 255, .16) rgba(255, 255, 255, .08); border-radius: var(--gR);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), var(--gSh); scrollbar-color: rgba(255, 255, 255, .35) transparent; }
#sheet.ovb :is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on), #sheet.ovb .under.mg { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), var(--gShO); }
.lane > .bal.probe.on:not(.fold) { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), 0 0 0 1px color-mix(in srgb, var(--gAcc) 60%, transparent), var(--gSh); }
#sheet.ovb .lane > .bal.probe.on:not(.fold) { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), 0 0 0 1px color-mix(in srgb, var(--gAcc) 60%, transparent), var(--gShO); }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) ::selection { background: rgba(255, 255, 255, .28); color: #FFFFFF; }
/* 8 px rhythm: 16 px insets, 8/16 gaps; controls keep the app's radii on the material, with a hairline and no second glass */
.lane > .bal.probe:not(.fold), .lane > .bal.conv.on { padding: 8px 16px 16px; }
.lane > .bal.probe:not(.fold) .bal-b, .lane > .bal.conv.on > .bal-b { margin: 0 -16px; padding: 0 16px 2px; }
.lane > .bal.probe:not(.fold) .bal-h { margin: 0 -8px 8px 0; }
.lane > .bal.conv.on .x { right: 8px; top: 8px; }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) .btn { min-height: 32px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .24); color: var(--ink-1); font-weight: 600; }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) .btn:hover { background: var(--sunk); border-color: rgba(255, 255, 255, .40); }
/* on glass a hover darkens (a lighter fill took a button's label to
   4.45:1 over a white page), and a proposed edit's inserted words read at body contrast: the first ink on a darker band instead of
   the pencil ink on a light accent tint (4.17:1 and Lc 66 over white); the page keeps the pencil */
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) .p-ins { color: var(--ink-1); background: var(--sunk); }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) .btn.text { background: none; border-color: transparent; color: var(--accent); }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on) .btn.primary, .lane > .bal.probe:not(.fold) .pacts .btn[data-intent="explain"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lane > .bal.probe:not(.fold) .pacts .btn[data-intent="explain"] .mk.ai { background: var(--accent-ink); }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) .ib:hover { background: rgba(255, 255, 255, .12); }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) :focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) .field { background: rgba(0, 0, 0, .14); border-color: rgba(255, 255, 255, .40); }
/* highlight colours: numbers by meaning (reported / calculated), never by colour alone (weight, rule and mono stay); the labels that
   name the meanings carry the swatch: filled for reported, outlined for calculated (the app's ■ / □) */
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) :is(.hq, .fig) { color: var(--mark-reported); }
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) :is(.hc, .fig.c) { color: var(--mark-calculated); }
/* a hovered or open figure on the glass darkens behind its light ink, never lightens (a white wash took it to 4.16:1) */
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) :is(.fig:hover, .fig.on) { background: var(--sunk); }
.sw { display: inline-block; width: 8px; height: 8px; margin: 0 6px 0 2px; vertical-align: 0; border-radius: 1px; }
.sw.q { background: var(--mark-reported); }
.sw.c { box-shadow: inset 0 0 0 2px var(--mark-calculated); }
/* the page's marks as swatches: a quoted figure's hairline in the accent, a calculated one's double rule in yellow */
.sw.pq, .sw.pc { width: 14px; height: 7px; background: none; box-shadow: none; border-radius: 0; }
.sw.pq { border-bottom: 1px solid var(--accent); }
.sw.pc { border-bottom: 3px double var(--mark-calculated); }
/* the page's key, in the sticky sheet header so it is in sight wherever the page shows a mark */
.shead .pkey { margin-right: auto; display: flex; flex-wrap: wrap; gap: 2px 14px; font: 500 12px/16px var(--sans); color: var(--ink-3); }
.shead .pkey .key { white-space: nowrap; }
.fig.c, .legend .lc { border-bottom-color: var(--mark-calculated); }
.stag { color: var(--mark-reported); }
.who .key, .ukey .key, .lh .key { white-space: nowrap; }
.ukey .key + .key { margin-left: 8px; }
/* the Probe's key sits in its fixed header, so it stays in sight at any scroll position of the Probe */
.bal-h .ukey, .wp-h .ukey { flex: none; font: 500 12px/16px var(--sans); color: var(--ink-3); }
/* the Probe: the figure sits in the glass (no dark inset); quiet labels; hairlines group the depths */
.lane > .bal.probe:not(.fold) .bal-h .ttl3, :is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on) .lh, .lane > .bal.conv.on .th .hd, .lane > .bal.conv.on .msg .who { color: var(--ink-3); }
.lane > .bal.probe:not(.fold) .plabel { margin: 0 0 8px; }
/* the content title and the line that describes it take the body serif; size, weight, colour stay */
.lane > .bal.probe:not(.fold) .plabel h3 { font: 600 21px/30px var(--serif); letter-spacing: -.01em; }
.lane > .bal.probe:not(.fold) .plabel + .carried { font-family: var(--serif); }
.lane > .bal.probe:not(.fold) .win { background: none; box-shadow: none; border-radius: 0; padding: 8px 0 0; }
.lane > .bal.probe:not(.fold) .travel .sleeve::before { background: var(--accent-ink); }
.lane > .bal.probe:not(.fold) .win .big .pchip { border-color: rgba(255, 255, 255, .40); padding: 1px 8px; }
.lane > .bal.probe:not(.fold) .win .meta { font-weight: 500; color: var(--ink-2); margin-top: 8px; }
/* body-size text on the light glass reads at --ink-2 or brighter (--ink-3 measured Lc 70-72 over a white
   page): the vernier's digits and its two labels, and the draft ink (--pencil above: a refused draft, a proposed deletion) */
.lane > .bal.probe:not(.fold) :is(.vern, .vern .lbl) { color: var(--ink-2); }
.lane > .bal.probe:not(.fold) .travel { margin: 16px 8px 0; }
.lane > .bal.probe:not(.fold) .travel .labs button { color: var(--ink-3); }
.lane > .bal.probe:not(.fold) .travel .labs button.on { color: var(--ink-1); text-decoration: underline 2px; text-underline-offset: 4px; }
.lane > .bal.probe:not(.fold) .work { background: none; padding: 0; }
/* the numbers a quote lends carry no chip (removed once every one kept 4.5:1 and Lc 75 on the glass without
   it); transparent, not left out, so neither the plain .qt mark wash nor the browser's own mark colours (Mark, MarkText) show */
.lane > .bal.probe:not(.fold) .qt mark { background: transparent; }
/* the phone's Probe sheet (opaque) drops it too, under the same condition: every number there kept 4.5:1 and Lc 75 on
   pixels without it, light and dark */
#wpb #lyFiling .qt mark { background: transparent; }
.lane > .bal.probe:not(.fold) .opchip { border-color: rgba(255, 255, 255, .26); }
.lane > .bal.probe:not(.fold) .opchip.c { border-style: solid; border-width: 1px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .10); }
.lane > .bal.probe:not(.fold) .pacts { gap: 4px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }

.lane > .bal.probe:not(.fold) .hon, .lane > .bal.probe:not(.fold) .also, .lane > .bal.conv.on .msg .meta { font-weight: 500; }
/* show-through: the header repeats the row in tabular figures; working lines carry a caption above a mono formula that breaks at
   operators, the result in bold; filing lines are quotes with a 1 px rule, the numbers they lend in their highlight colour with no
   chip, each with its locator just under it */
.under.mg { --raised: var(--gBand); padding: 8px 16px 12px; font-weight: 500; color: var(--ink-2); }
.under.mg .more, .under.mg .moreup { margin: 0 -16px; }
.under.mg .ulh.top { padding: 8px 0; }
.under.mg .ulh.top > span:first-child { color: var(--ink-3); }
/* the panel heading and the Apply receipt take focus from script: a ring whatever moved it there */
.under .sth:focus, .receipt:focus, #stbar [data-act="stdone"]:focus { outline: 2px solid var(--ink-1); outline-offset: 2px; border-radius: 4px; }
/* WCAG 2.4.7: a thread container the app focused (a saved memo's balloon, a kept answer in the tray) shows a ring in the
   page's own accent, also over the glass, where --accent is the glass tint; --ring-page holds the value :root resolves */
:root { --ring-page: var(--accent); }
.fx:focus { outline: 2px solid var(--ring-page); outline-offset: 2px; }
.under.mg .ulr { padding: 8px 0 0; gap: 0 16px; color: var(--ink-3); }
.under.mg .ulr b { font: 600 15px/22px var(--serif); color: var(--ink-1); letter-spacing: 0; } /* the row's label in the body serif */
.under.mg .ulr strong { font: 600 14px/20px var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-1); }
.under.mg .ulh { color: var(--ink-3); margin: 16px 0 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.under.mg .ulh.top { border-top: 0; margin-top: -8px; }
.under.mg .ulh span + span { color: var(--ink-3); }
/* lines never touch: the paging bands need at least a pixel between one line's foot and the next line's head */
.under.mg .wk { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; padding: 8px 0 6px 8px; margin: 2px 0 0; }
.under.mg .ulh + .wk { border-top: 0; }
.under.mg .wk .wc { font: 500 12px/16px var(--sans); color: var(--ink-3); margin-bottom: 4px; }
.under.mg .wk .wc b { font: 600 12.5px/16px var(--sans); color: var(--ink-1); margin-right: 8px; }
/* key words: the name of what is read (the Probe's title, the row a show-through shows, each WORKING
   line's item and period, each filing line's item) stays in the ink it already has, bold; no new colour, no marker */
:is(.lane > .bal.probe:not(.fold), .lane > .bal.conv.on, .under.mg) .kw { font-weight: 700; }
.under.mg .wk .sc { font: inherit; color: inherit; margin: 0; }
.under.mg .wk .fx { font: 500 12.5px/20px var(--mono); font-variant-numeric: tabular-nums; }
.under.mg .wk .t { display: inline-block; max-width: 100%; overflow-wrap: anywhere; }
.under.mg .wk .res { font-weight: 600; } /* 600: the Medium face; Athena Mono 700 (Bold) is held for the key words */
.under.mg .wk .fx b { font-weight: 700; } /* "shown as" is Manrope: unchanged */
.under.mg .wk [data-op] { font-weight: 600; }
.under.mg .wk.hot { box-shadow: inset 1px 0 0 rgba(255, 255, 255, .75); color: var(--ink-1); }

<template id="essay"><h1 class="et">When intelligence becomes a service</h1>
<p><em>Athena and the effort to make expert work accessible</em></p>
<p>Jaden B Joeng, Founder &amp; CEO, Trade Matrix Labs · 4 November 2026</p>
<h2>0. Introduction</h2>
<p>A cheap AI answer can still cost a lot to use. Whoever reads it may have to track down the original sources, test an assumption and work out which conclusions hold up. An expert can treat that as a useful starting point. Someone who came looking for expertise in the first place is left with a difficult problem: how far should they trust the answer?</p>
<p>Much of the opportunity for AI-native services sits in that unfinished work. A service can keep the evidence behind an answer, run calculations with tools and let the reader ask a follow-up without redoing the research. Inference then becomes part of an ongoing service of gathering material, interpreting it and adjusting the explanation as the customer's needs become clearer.</p>
<p>The people who already do this work could save time, and the effect might not stop there. If specialist analysis becomes affordable and easier to use, someone who went without it before may be able to make it part of their life. That possibility shapes the direction of Trade Matrix Labs. It also raises a demanding question for any product built around AI: can it deliver work people have reason to rely on, at a price that makes repeated use worthwhile?</p>
<h2>1. Intention: Why Athena?</h2>
<p>Financial research makes that question concrete. A company's Form 10-K covers its business and financial condition and includes audited financial statements.<a class="cite" href="https://www.investor.gov/introduction-investing/investing-basics/glossary/form-10-k" target="_blank" rel="noopener" aria-label="Source 4">[4]</a> The document is available, but understanding it takes more than finding a number. You have to know what the number measures, which period it covers and how it relates to the rest of the business.</p>
<p>Take a contractual commitment. The amount committed over the life of an agreement and the amount still outstanding are two different things. An analysis that mixes them up can mislead even while quoting the filing accurately, and catching the mistake takes the very knowledge the reader may be hoping to get from the report.</p>
<p>Professional teams have the expertise but only so much time. Individual readers may also run into barriers of training, language or cost. Athena starts from these limits. Its purpose is to make financial analysis easier to examine and use, including for people with no institutional research budget. The report is where they start. From there they can open its evidence and question it, which lets the work continue.</p>
<h2>2. Who can put AI to work?</h2>
<p>We should be wary of assuming that access to a model will create a broad paying audience, and the market gives reasons why. In August 2026, 4.5% of eligible consumers in YipitData's U.S. e-receipt panel held an active paid personal subscription to ChatGPT, Gemini or Claude, according to a16z's account of the data. The top 10% of spenders accounted for roughly half of observed consumer AI spending.<a class="cite" href="https://a16z.com/100-gen-ai-apps-7/" target="_blank" rel="noopener" aria-label="Source 1">[1]</a> These figures measure subscription penetration, not free-to-paid conversion, and they don't tell us why people aren't paying. Free tools may already be good enough. Or a person may still lack a service suited to a task that matters to them.</p>
<p><em>Table 1. Paid consumer AI use, from YipitData as reported by a16z.<a class="cite" href="https://a16z.com/100-gen-ai-apps-7/" target="_blank" rel="noopener" aria-label="Source 1">[1]</a></em></p>
<table>
<thead>
<tr>
<th>Measure</th>
<th>Figure</th>
<th>What it does not show</th>
</tr>
</thead>
<tbody>
<tr>
<td>Eligible U.S. consumers with an active paid personal subscription to ChatGPT, Gemini or Claude, August 2026</td>
<td>4.5%</td>
<td>Free-to-paid conversion</td>
</tr>
<tr>
<td>Share of observed consumer AI spending from the top 10% of spenders</td>
<td>Roughly half</td>
<td>Why other people aren't paying</td>
</tr>
</tbody>
</table>
<p>The ways people use AI differ too. In Anthropic's February 2026 sample of Claude conversations, coding stayed prominent while other uses grew. Longer-standing users were more likely to get responses the study classified as successful.<a class="cite" href="https://www.anthropic.com/research/economic-index-march-2026-report" target="_blank" rel="noopener" aria-label="Source 2">[2]</a> That association raises a practical question. How much does a customer have to learn before they get useful work from the tool?</p>
<p>Then there is trust. In an August 2026 survey, U.S. adults expected reliability, privacy and a preference for human interaction to be among the barriers to workplace AI adoption by 2030.<a class="cite" href="https://www.anthropic.com/research/ai-expectations-gap" target="_blank" rel="noopener" aria-label="Source 3">[3]</a> A useful product has to take account of where an answer will end up. An explanation that's fine for casual exploration may need much more support before someone puts it into professional work.</p>
<p>For Trade Matrix Labs, that makes access to specialist services worth investigating. Someone already buying research may value the time saved. A person never able to afford it may gain a capability they didn't have before. An affordable service that fits the task could bring both into the market. The second group is much of why we're doing this. Their needs will decide whether easier access leads to regular use.</p>
<h2>3. Building expertise into a service</h2>
<p>The commitment example shows why checking a report takes several kinds of work. Software can confirm that a quotation appears in a filing and recompute a formula from its inputs. Neither check settles, on its own, whether a lifetime amount has been described as a remaining obligation, and that interpretation has to survive review too.</p>
<p><em>Table 2. What each check can settle, using the commitment example.</em></p>
<table>
<thead>
<tr>
<th>Question</th>
<th>Who settles it</th>
</tr>
</thead>
<tbody>
<tr>
<td>Does the quotation appear in the filing?</td>
<td>Software</td>
</tr>
<tr>
<td>Does the formula recompute from its inputs?</td>
<td>Software</td>
</tr>
<tr>
<td>Has a lifetime amount been described as a remaining obligation?</td>
<td>Review of the interpretation</td>
</tr>
</tbody>
</table>
<p>So a research workflow has to keep the meaning of the evidence intact as it moves through the system. The model needs the relevant passage and enough context to read it properly. A calculation needs inputs you can identify. Review has to examine the conclusion those pieces are being used to support. And when the evidence falls short, the answer has to say where the uncertainty is.</p>
<p>The economics of AI has a useful parallel. Imas, Koh and Legg distinguish an agent's competence from an organization's capacity to coordinate work.<a class="cite" href="https://institute.deepmind.com/essays/the-economics-of-intelligence/" target="_blank" rel="noopener" aria-label="Source 8">[8]</a> Applied to a research service, that points to the handoffs: what reaches the writer, what a reviewer can inspect and whether a correction makes it into the delivered report.</p>
<p>All of this changes how affordability should be measured. Inference is one part of what a report costs. Revisions and expert intervention add to it, and so does the time a reader spends checking the result. A service gets more accessible when it can reduce that combined burden while still meeting a useful standard of quality.</p>
<h2>4. Following a question through Athena</h2>
<p>Athena began as a private report engine. For the hackathon the work grew into a Reading App (Athena AI) and Ask Agent, with both components in one public repository. The report and the means to examine it now sit in the same place.<a class="cite" href="#es-ref-B" data-act="devanchor" data-id="es-ref-B" aria-label="Note B">[B]</a></p>
<p>Suppose a reader wants to know why cash flow has moved differently from earnings. They might start from a figure in the report. Underlined figures are either quoted from the filing or calculated by code from quoted inputs. Selecting one opens the Probe: Read shows the value, Exact exposes its precision, Work shows the arithmetic and Filing brings up the supporting passage. Holding Space lets the reader examine those relationships through a table, and the evidence is there at the point where the question comes up.</p>
<p><em>Table 3. What a reader sees when they select a figure.</em></p>
<table>
<thead>
<tr>
<th>View</th>
<th>What it shows</th>
</tr>
</thead>
<tbody>
<tr>
<td>Read</td>
<td>The value</td>
</tr>
<tr>
<td>Exact</td>
<td>Its precision</td>
</tr>
<tr>
<td>Work</td>
<td>The arithmetic</td>
</tr>
<tr>
<td>Filing</td>
<td>The supporting passage</td>
</tr>
<tr>
<td>Hold Space</td>

</tr>
</tbody>
</table>
<p>From the same panel the reader can ask about the figure. Ask works from the current report edition, cites its passages and checks its numerical answers against that edition. Asking a question leaves the report unchanged; actions that do change something require approval. The conversation can build up an explanation without losing the report it refers to.</p>
<p>Questions, answers and memos stay attached to their subjects and are saved in Athena's Library beside the public report. Custom reports and export are planned. The direction is to let readers carry the analysis into their own work with the evidence still available. Someone learning to read a filing may need a plain explanation, while an experienced analyst may want to examine an assumption more closely.</p>
<p>Behind all this, agents read the filing, draft the report and send it for review. Each job has a specified model, tools and cost limit. A failed code check blocks delivery, and users can follow the production stages in the application. An evidence store keeps the quotations and facts used in the report.</p>
<p>Several readers can use the same report edition, each with their own questions. Reusing the research this way could spread production and review costs across them. Whether that pays off depends on how much follow-up work each reader needs and whether the shared analysis is useful enough to come back to.</p>
<h2>5. Reproducing the standard</h2>
<p>The quality target came from reference reports built through repeated work with AI and my experience in financial analysis, statistics and trading. Review covered financial interpretation as well as calculations and sources. The resulting reports set a standard for work that could support further analysis and be adapted to different readers' needs.</p>
<p>The hackathon required Meta models, and the provided $150 in credits informed the choice of Muse Spark. That configuration has not consistently reproduced the reference quality. So development has focused on what we give the model, what we hand to calculation tools and how agents revise and review a report. Those parts of the system can be changed and examined alongside the choice of model.</p>
<p>One assisted revision of a Palantir FY2025 report shows the progress and the work left to do. The review found that earlier errors in the treatment of cloud commitments and leases had been corrected. All 27 calculated figures agreed with independent recomputation, and 83 quotations matched the filing text supplied for review. Structure and prose still needed substantial improvement.<a class="cite" href="#es-ref-A" data-act="devanchor" data-id="es-ref-A" aria-label="Note A">[A]</a></p>
<p>Correcting that report is a different achievement from producing comparable work from a new filing. The next test is to produce such work from a new filing with limited expert correction, while measuring delivery cost and time. Weight-level post-training was beyond the time and compute we had for this iteration. For now the task is to find out how far the available model and workflow can go, with evidence that stays usable when a reader takes the work further.</p>
<h2>6. Specialist work in everyday AI</h2>
<p>Meta's announcements for the Muse personal agent and AI glasses describe AI working across apps and a growing family of devices.<a class="cite" href="https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/" target="_blank" rel="noopener" aria-label="Source 5">[5]</a><a class="cite" href="https://about.fb.com/news/2026/09/the-biggest-news-from-connect-2026/" target="_blank" rel="noopener" aria-label="Source 6">[6]</a> That brings the question of useful specialist services into everyday settings. Someone who asks a question while walking may not have much chance to inspect a long answer, yet still need to know when its conclusion rests on an assumption.</p>
<p>One possible experience starts with a short spoken explanation. Later the person opens the supporting calculation on a phone and goes on reading at a desk. If the question, report edition and evidence stay connected, the work can carry on without anyone rebuilding the conversation at each step. The Reading App (Athena AI) and Ask Agent provide a concrete place to start exploring that continuity.</p>
<p>Meta already describes activity logs, editable memory and approval controls in Muse.<a class="cite" href="https://introducing.muse.ai/" target="_blank" rel="noopener" aria-label="Source 7">[7]</a> Financial research adds requirements of its own. A claim has to refer to the right reporting period, and a calculation has to answer the question being asked. The interface must also leave room for uncertainty. A fluent spoken answer can be easy to accept, particularly when the listener can't see the material behind it.</p>
<p>Here Athena's approach could contribute to Meta's wider direction. If people can examine specialist work and build on it, they would have more reasons to use personal AI for tasks that matter to them. With permission, their questions could show where an explanation confuses them or an interface interrupts the work. Corrections would need verification before entering the evidence base. Over time that feedback could improve how the service delivers expertise through different interfaces.</p>
<h2>7. Beyond the hackathon</h2>
<p>A useful next step is getting Athena to people who would otherwise struggle to obtain professional research. What can they understand with it? What can they produce, and where do they still get stuck? Repeat use, the effort left to the reader and the expert intervention behind each report would help show whether the service is delivering on its purpose.</p>
<p>The same questions need testing across more companies, reporting periods and languages. Taking the approach to another field would require that field's own standards and evidence. Personal context could make the service more relevant, provided users control how it's used and give separate permission for anything beyond delivering the service.</p>
<p>Longer term, we want to build services in which AI takes on more of the work needed to make expertise useful. Athena starts with financial research because its sources, calculations and interpretations can be examined closely. The next stage should show whether that work lets people with less time, money or specialist training get more from research they couldn't readily use before.</p>

/* ================= exact numbers (BigInt decimal strings; no float rounding) ================= */
function roundStr(str, shift, dp, dir = 0) { // round(value * 10^shift, dp) half-up (dir 0), down (-1) or up (+1), as a string
  let neg = str.startsWith("-"); if (neg) str = str.slice(1);
  const [i, f = ""] = str.split(".");
  let n = BigInt(i + f); const k = f.length - shift - dp; let q;
  if (k <= 0) q = n * 10n ** BigInt(-k);
  else { const d = 10n ** BigInt(k), r = n % d; q = n / d; if (dir ? r && (dir > 0) !== neg : r * 2n >= d) q += 1n; }

function shiftStr(v, k) { // exact value * 10^k as a plain decimal string

  const [i, f = ""] = v.split("."); let d = i + f, p = i.length + k;
  if (p <= 0) { d = "0".repeat(1 - p) + d; p = 1; }

const isText = f => f.kind !== "calculated" && !f.concept; // reported from a text quote (rounded), not from a tag
const roundedText = f => isText(f) && /[^\d,.\s()]/.test(String(f.shown || "")) && !isDash(f); // "$4.1 billion", "109%": rounded in the text
const showsAsPrinted = f => isText(f) && f.shown && (roundedText(f) || !/^usd/.test(f.unit)); // bare "156,052" ($ thousands) renders from value + scale

function spec(f, style) {

// one round asks for every run that is still open (and once per visit for an ended one), then again in 5 s while any is open
function pollJobs() {

  Promise.all(due.map(r => api("GET", `${JAPI}/jobs/${encodeURIComponent(r.id)}${after(r)}`).then(v => gotRun(r, v), e => {
    if (e.status === 404) { LJ.v[r.id] = { gone: true }; LJ.runs = LJ.runs.filter(x => x !== r); saveRuns(); }

  }))).then(() => {

}
const lastSeq = ev => (ev || []).reduce((m, e) => typeof e.seq === "number" && e.seq > m ? e.seq : m, 0);

  if (ENDED.includes(v.state)) { if (!r.told) { r.told = v.state; r.seen = false; saveRuns(); runEnded(r, v, !was); } }
  else if (was && was.state !== v.state && S.route === "writing" && S.liveJob === r.id) live(`${runWord(v)}. ${RUN_W[v.state] ? RUN_W[v.state][1] : ""}`);
}
